services:
  - type: web
    name: sms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true

      # Render auto-injects DATABASE_URL from the linked PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: sms-db
          property: connectionString

      - key: INSTALL_SECRET_KEY
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_USERNAME
        value: superadmin
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["*"]'
      - key: UPLOAD_DIR
        value: /tmp/uploads

databases:
  - name: sms-db
    plan: free
    region: singapore
    databaseName: sms_db
    user: sms_user
