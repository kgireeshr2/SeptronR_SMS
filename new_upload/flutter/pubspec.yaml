name: sms_flutter
description: SeptroSchool — mobile client (Android + iOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (plain Riverpod — no codegen)
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # UI / utils
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

  # File open (PDF receipts / report cards)
  path_provider: ^2.1.4
  open_filex: ^4.5.0

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
